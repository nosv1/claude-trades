# Refresh the data daily, commit it if it changed, and publish site/ to GitHub Pages.
name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC (morning in the US)
  workflow_dispatch:

permissions:
  contents: write # commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch data
        run: |
          pip install openpyxl==3.1.5
          python scripts/fetch_data.py
          # Annual trade data: refreshes only when trade.json is 30+ days old (~5 min, rate-limited API).
          python scripts/fetch_trade.py || echo "::warning::Trade data fetch failed; keeping the previous trade.json."

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898388+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Refresh data"
          # Another run may have pushed since checkout: rebase onto it (keeping our fresh
          # data on conflict; in a rebase "theirs" is the commit being replayed) and retry.
          for attempt in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; break; }
          done
          # Never block the deploy over a data commit; the next run will commit it.
          echo "::warning::Could not push refreshed data; deploying anyway."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
