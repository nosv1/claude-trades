# Refresh the data daily, commit it if it changed, and publish site/ to GitHub Pages.
name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *" # daily, 13:17 UTC (morning in the US)
  workflow_dispatch:

permissions:
  contents: write # commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      claims: ${{ steps.claims.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch data
        run: |
          pip install openpyxl==3.1.5
          python scripts/fetch_data.py
          # Annual trade data: refreshes only when trade.json is 30+ days old (~5 min, rate-limited API).
          python scripts/fetch_trade.py || echo "::warning::Trade data fetch failed; keeping the previous trade.json."

      # The page's fixed-period dollar claims, against the fresh data. A failure doesn't block the
      # deploy, but the deploy job then fails the run so it shows red and emails.
      - name: Check page claims
        id: claims
        continue-on-error: true
        run: python scripts/check_claims.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898388+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Refresh data"
          # Another run may have pushed since checkout: rebase onto it (keeping our fresh
          # data on conflict; in a rebase "theirs" is the commit being replayed) and retry.
          for attempt in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; break; }
          done
          # Never block the deploy over a data commit; the next run will commit it.
          echo "::warning::Could not push refreshed data; deploying anyway."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  claims:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && needs.build.outputs.claims == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Report the broken page claim
        run: |
          echo "::error title=Page claim check failed::scripts/check_claims.py failed on the fresh data. Either a sentence in site/index.html or site/quiz.js no longer matches it, or the data is missing; see the build job's 'Check page claims' log."
          exit 1
