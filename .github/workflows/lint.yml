name: Lint

# The coding standard (nosv1/nosv1 CODING.md) rule 10: zero warnings, strict types, baselines, checked on every push. Kept apart from
# update-and-deploy.yml so a lint failure never blocks the daily data refresh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tools
        run: |
          npm ci
          pip install -r requirements-dev.txt

      - name: Lint, types, baselines, claims (npm run check)
        run: npm run check
